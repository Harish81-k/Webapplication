<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile - Birla Opus Designs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f8fafc; font-family: system-ui, sans-serif; }
        .navbar-custom { background-color: #0f172a !important; border-bottom: 1px solid #1e293b; }
        .dashboard-card { border: none; border-radius: 16px; background: #ffffff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); }
        .card-header-banner { background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.98)), url('https://images.unsplash.com/photo-1562259949-e8e7689d7828?q=80&w=1920') no-repeat center center; background-size: cover; padding: 40px 20px; text-align: center; }
        .text-accent-green { color: #02c39a; font-weight: 600; }
        .form-label { color: #334155; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px 14px; background-color: #f8fafc; }
        .autocomplete-dropdown { border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; margin-top: 4px; z-index: 1000; }
        .autocomplete-dropdown .list-group-item { border: none; padding: 12px 16px; font-size: 0.9rem; color: #475569; }
        .btn-primary-custom { background-color: #0f172a; color: #ffffff; border-radius: 10px; font-weight: 600; padding: 12px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-palette-fill text-accent-green me-2"></i>Birla Opus Designs</a>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 650px;">
        <div class="card dashboard-card overflow-hidden">
            <div class="card-header-banner">
                <h3 class="text-white fw-bold m-0">Delivery Profile</h3>
                <p class="text-white-50 small mb-0 mt-1">Manage your shipping details.</p>
            </div>
            
            <div class="card-body p-4 p-sm-5">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Full Name</label>
                        {{ form.full_name }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Contact Number</label>
                        {{ form.phone }}
                        <div class="form-text text-muted small">Enter 10-digit mobile number.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Profile Image</label>
                        <div class="p-3 border rounded-3 bg-light">{{ form.profile_image }}</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Delivery Address</label>
                        {{ form.delivery_address }}
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mt-3 shadow-sm">Save Profile</button>
                </form>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Add bootstrap class to inputs
    document.querySelectorAll('input, textarea').forEach(input => {
        if(!['submit', 'hidden', 'checkbox', 'radio'].includes(input.type)) {
            input.classList.add('form-control');
        }
    });

    // Address Autocomplete Logic
    const addressInput = document.querySelector('textarea[name="delivery_address"]');
    if (addressInput) {
        addressInput.setAttribute('rows', '2');
        const resultsContainer = document.createElement('div');
        resultsContainer.className = 'list-group position-absolute w-100 shadow autocomplete-dropdown';
        addressInput.parentNode.style.position = 'relative';
        addressInput.parentNode.appendChild(resultsContainer);

        addressInput.addEventListener('input', (e) => {
            const query = e.target.value;
            if (query.length < 3) { resultsContainer.innerHTML = ''; return; }
            
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
                .then(res => res.json())
                .then(data => {
                    resultsContainer.innerHTML = '';
                    data.forEach(place => {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'list-group-item list-group-item-action';
                        item.textContent = place.display_name;
                        item.onclick = () => { addressInput.value = place.display_name; resultsContainer.innerHTML = ''; };
                        resultsContainer.appendChild(item);
                    });
                });
        });
    }
});
</script>
</body>
</html>
