<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
<div class="container mt-5">
    <h2 class="mb-4">Customer Dashboard</h2>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-4 shadow">
                <div class="card-body">
                    <h5 class="card-title">Total Regular Users</h5>
                    <p class="card-text display-4">{{ total_users }}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-striped border">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody>
                {% for profile in profiles %}
                <tr>
                    <td><strong>{{ profile.full_name }}</strong></td>
                    <td>{{ profile.phone }}</td>
                    <td>{{ profile.user.email }}</td>
                    <td>{{ profile.delivery_address }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No regular users found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
