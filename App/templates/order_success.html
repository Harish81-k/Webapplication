<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocation Success - Birla Opus Designs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        
        /* Card Entrance Animation */
        .success-card { 
            border: none; 
            border-radius: 20px; 
            background: #ffffff; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            max-width: 550px; 
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon-circle { 
            width: 90px; 
            height: 90px; 
            background-color: #d1fae5; 
            color: #02c39a; 
            border-radius: 50%; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
        }

        .btn-home { 
            background-color: #0f172a; 
            color: white; 
            border-radius: 10px; 
            font-weight: 600; 
            padding: 14px 30px; 
            border: none; 
            transition: all 0.3s ease; 
            text-decoration: none;
        }
        .btn-home:hover { background-color: #1e293b; color: white; transform: translateY(-2px); }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container text-center">
        <div class="card success-card mx-auto p-5">
            <div class="icon-circle mb-4 shadow-sm"><i class="bi bi-shield-check fs-1"></i></div>
            <h2 class="fw-bold text-dark mb-2">Order Confirmed!</h2>
            <p class="text-muted small px-3">Your luxury paint dynamic coatings formulation metrics allocation index records has been successfully logged.</p>
            
            <div class="bg-light p-3 border rounded-3 my-4 text-start small">
                <div class="d-flex justify-content-between mb-2">
                    <strong>Verification Code:</strong> 
                    <span class="text-secondary">{{ tx_id|default:"COD-PROT-8829" }}</span>
                </div>
                <div class="d-flex justify-content-between">
                    <strong>Gateway System:</strong> 
                    <span class="badge bg-dark">Opus Secure Verified Node</span>
                </div>
            </div>

            <a href="{% url 'gallery' %}" class="btn btn-home shadow-sm w-100">
                <i class="bi bi-house-door me-2"></i>Return to Studio Gallery
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            // 1. Success Sound
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
            audio.play().catch(e => console.log("Sound interaction required"));

            // 2. Confetti Animation
            const duration = 2.5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                
                confetti({
                    ...defaults,
                    particleCount: 40,
                    origin: { x: Math.random(), y: Math.random() - 0.2 }
                });
            }, 250);
        });
    </script>
</body>
</html>
